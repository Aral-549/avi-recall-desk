[project]
name = "categoriser-extractor"
version = "1.0.0"
description = "AVI categoriser extraction sidecar (Scrapling parser behind an SSRF-guarded fetcher)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27,<0.29",
  "httpcore>=1.0,<2",
  "scrapling>=0.5,<0.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
